name: Release

# Tag pushes `v*` build, package and publish a GitHub release. A manual run
# (workflow_dispatch) is a dry run: it builds and uploads the same archives as
# workflow artifacts and never creates a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default; only the `release` job gets `contents: write`.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # R-GUIDE Section 12: deny rustc warnings through Cargo build.warnings.
  CARGO_BUILD_WARNINGS: deny

defaults:
  run:
    shell: bash

# Action pins (full commit SHAs; versions in the trailing comments):
# actions/checkout v7.0.1, dtolnay/rust-toolchain (master, `toolchain:` selects
# the compiler), taiki-e/install-action v2, mlugg/setup-zig v2.2.1,
# actions/upload-artifact v7.0.2, actions/download-artifact v8.0.2.
# No build cache is restored here, so a poisoned cache cannot reach a release.
jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Resolve the release version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/kcc/Cargo.toml | head -n 1)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ "$version" != "$crate_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match crates/kcc version $crate_version"
              exit 1
            fi
          else
            version="$crate_version-dryrun.${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
            exe: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
            exe: ""
          - target: aarch64-apple-darwin
            os: macos-14
            zigbuild: false
            exe: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zigbuild: false
            exe: ".exe"
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - if: matrix.zigbuild
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false
      - if: matrix.zigbuild
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build (cargo-zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked --target "$TARGET" -p kcc
      - name: Build (cargo)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked --target "$TARGET" -p kcc
      - name: Package
        env:
          EXE: ${{ matrix.exe }}
        run: scripts/package-release.sh "$VERSION" "$TARGET" "target/$TARGET/release/kcc$EXE" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kcc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kcc-*
          path: dist
      - name: Aggregate and verify checksums
        run: |
          mkdir release
          find dist -type f -name SHA256SUMS -exec cat {} + | sort -k 2 > release/SHA256SUMS
          find dist -type f \( -name 'kcc-*.tar.gz' -o -name 'kcc-*.zip' \) -exec mv -t release {} +
          # One line per matrix target of the build job.
          lines=$(wc -l < release/SHA256SUMS)
          if [[ "$lines" -ne 4 ]]; then
            echo "::error::expected 4 archives in SHA256SUMS, found $lines"
            exit 1
          fi
          scripts/package-release.sh --verify release
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [meta, checksums]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "kcc $VERSION" \
            --generate-notes \
            "${prerelease[@]}"
