name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # release.yml and container.yml call this workflow as their gate job before they
  # build or publish anything, so every gate-tool pin lives here only.
  workflow_call:

# Least-privilege default: every job only reads the repo and runs cargo/tooling
# commands, so the read-only default covers the whole workflow. A caller cannot
# widen it: a called workflow's token is at most the calling job's.
permissions:
  contents: read

# A newer run of the same ref cancels the superseded one; a tag (release) run is never
# cancelled. GitHub docs (reusing workflows): a called workflow uses the name of its
# caller workflow in github.workflow, and github.ref is the caller's too. So
# when release.yml or container.yml calls this file, a group shared with the caller
# would cancel or deadlock it. The literal `ci-` prefix keeps this group apart from
# their groups (`release-<ref>`, `container-<ref>`), and github.workflow keeps the
# Release and Container calls of the same tag apart from each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # R-GUIDE Section 12: deny rustc warnings through Cargo build.warnings (the
  # config key), never through the RUSTFLAGS variable.
  CARGO_BUILD_WARNINGS: deny

# Action pins: actions/checkout v7.0.1, dtolnay/rust-toolchain (master, the
# `toolchain:` input selects the compiler), Swatinem/rust-cache v2.9.3,
# taiki-e/install-action v2.90.6 (shellcheck 0.11.0); actionlint v1.7.12 through
# `go install`. Refresh by hand or through Dependabot (which is told to leave
# rust-toolchain alone, see .github/dependabot.yml). Gate tools are pinned
# (R-GUIDE Section 12: tool installs ignore the dependency cooldown) and bumped
# deliberately: cargo-deny 0.21.0, cargo-audit 0.23.0, cargo-vet 0.10.3,
# cargo-machete 0.10.1, taplo 0.10.0. A gate-tool version must be in the pinned
# install-action's manifest: an unlisted one falls back to cargo-binstall.
jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "nightly-2026-10-03"
          components: rustfmt
      - run: cargo +nightly-2026-10-03 fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `workspace` lints everything with all features; every other leg lints
        # and tests one library crate alone at its default features, because
        # --all-features never compiles cfg(not(feature = "..")) code.
        scope:
          - workspace
          - kcc-app
          - kcc-catalog
          - kcc-config
          - kcc-domain
          - kcc-i18n
          - kcc-mcp
          - kcc-migrate
          - kcc-rci
          - kcc-telemetry
          - kcc-testkit
          - kcc-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same free-up as `test`: this job compiles the whole workspace's dependency tree.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (workspace, all features)
        if: matrix.scope == 'workspace'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (library, default features)
        if: matrix.scope != 'workspace'
        run: cargo clippy -p ${{ matrix.scope }} --all-targets -- -D warnings
      - name: Test (library, default features)
        if: matrix.scope != 'workspace'
        run: cargo test -p ${{ matrix.scope }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Debug info is the bulk of the target dir; the local gates use the same settings.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships toolchains this workspace never uses; without removing
      # them the target dir outgrows the disk (ld died with SIGBUS on a full disk).
      # The Docker image cache is the runner's own.
      - name: Free runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --no-fail-fast
        if: runner.os != 'Windows'
      - name: Doctests
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo test --doc --workspace
      # kcc refuses an elevated process token (exit 77, docs/SECURITY.md "Privilege
      # floor") and the Windows runner runs every job elevated, so the Windows leg runs
      # the same two commands through a launcher that drops the elevation. The floor
      # stays as it is. The launcher first gives the runner user (not Administrators)
      # Modify on the checkout, the cargo dirs and RUNNER_TEMP, and before each command it checks
      # the child token and fails the step at once if it is still elevated.
      - name: Test (de-elevated)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/deelevate.ps1 -GrantAccess
          ./.github/scripts/deelevate.ps1 -CommandLine 'cargo test --workspace --all-features --no-fail-fast'
      - name: Doctests (de-elevated)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -CommandLine 'cargo test --doc --workspace'
      - name: Disk left
        if: always() && runner.os == 'Linux'
        run: df -h /

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same free-up as `test`: this job compiles the whole workspace's dependency tree.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0
      - run: cargo deny check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.23.0
      - run: cargo audit

  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-vet@0.10.3
      # Cargo.lock and supply-chain/imports.lock are committed, so this is
      # deterministic and offline. On a bump run `cargo vet` (fetches the
      # imported audit sets), add `cargo vet add-exemption <crate> <version>
      # --criteria safe-to-deploy` only for a crate no imported set covers,
      # name each one in the commit body, then run `cargo vet prune`
      # (CONTRIBUTING.md, "Dependency bumps").
      - run: cargo vet --locked

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-machete@0.10.1
      # First-party crates only: spikes/ is throwaway code outside the profile.
      - run: cargo machete crates xtask

  msrv:
    name: MSRV (1.100.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same free-up as `test`: this job compiles the whole workspace's dependency tree.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.100.0 build --workspace --all-features

  gates:
    name: Project gates (xtask)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          # lint-completeness reads the Cargo lint list from the rust-docs component
          # and the Clippy lint list from clippy-driver.
          components: clippy, rust-docs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask allow-gate
      - run: cargo xtask profile-eq
      - run: cargo xtask i18n-check
      - run: cargo xtask assets-check
      - run: cargo xtask cancel-safety
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: shellcheck@0.11.0
      - run: shellcheck deploy/podman/*.sh scripts/*.sh scripts/live/*.sh
      # install-action has no actionlint manifest; `go install` of the tagged
      # module is verified against the Go checksum database (sum.golang.org).
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml'
      # Last, so a failure here never hides the result of the gates above.
      - run: cargo xtask lint-completeness

  xtask:
    name: xtask (clippy, test, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: xtask
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0,cargo-vet@0.10.3
      - run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path xtask/Cargo.toml --all-features
      - run: cargo deny --manifest-path xtask/Cargo.toml check
      - run: cargo vet --locked --manifest-path xtask/Cargo.toml

  taplo:
    name: TOML format (taplo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: taplo@0.10.0
      - run: taplo fmt --check

  guidelines:
    name: Vendored guidelines checksum
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cd docs/rust-guidelines && sha256sum -c SHA256SUMS
