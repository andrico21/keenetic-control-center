name: Probe

# A fast diagnostic loop for one runner: dispatch it with a filtered `cargo test`
# instead of waiting for the whole CI matrix, for example
#   gh workflow run probe.yml -f os=macos-latest -f command='-p kcc-app --test platform_timing_probe -- --ignored' -f repeat=3
# Only repository writers can dispatch a workflow. The inputs still reach the
# scripts through `env:` only, never through `${{ }}` inside a script.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner image for the `cargo test` probe
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
        default: macos-latest
      command:
        description: Arguments after `cargo test`; test-binary arguments after `--`; output is never captured (RUST_TEST_NOCAPTURE)
        type: string
        default: -p kcc-app --test poller
      repeat:
        description: How many times to run the command (a positive integer)
        type: string
        default: "1"
      token_probe:
        description: Also run the Windows token diagnostic job (ignores `os`)
        type: boolean
        default: false

permissions:
  contents: read

# The literal `probe-` prefix keeps this group apart from ci.yml (`ci-...`),
# release.yml and container.yml. A newer probe of the same ref and runner image
# cancels the older one; probes of different images run side by side.
concurrency:
  group: probe-${{ github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

# Same action pins as ci.yml.
jobs:
  probe:
    name: Probe (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    # Same settings as ci.yml's `test` job.
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_WARNINGS: deny
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same free-up as ci.yml's `test` job.
      - name: Free runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      # A probe usually fails (that is what it is for), so its dependency cache is
      # saved on failure too; the default job-based key keeps it apart from ci.yml's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: "true"
      # Same launcher as ci.yml's Windows leg: kcc refuses an elevated token.
      - name: Grant the de-elevated child access
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -GrantAccess
      - name: cargo test
        id: run
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          REPEAT: ${{ inputs.repeat }}
          RUST_TEST_NOCAPTURE: "1"
        run: |
          set -uo pipefail
          set -f
          case "$REPEAT" in
            '' | *[!0-9]* | 0) echo "::error::repeat must be a positive integer, got '$REPEAT'"; exit 2 ;;
          esac
          run_once() {
            if [ "$RUNNER_OS" = Windows ]; then
              pwsh -NoProfile -NonInteractive -File .github/scripts/deelevate.ps1 \
                -CommandLine "cargo test $COMMAND"
            else
              # shellcheck disable=SC2086 # COMMAND is a list of cargo arguments.
              cargo test $COMMAND
            fi
          }
          df -h .
          final=0
          failures=0
          for i in $(seq 1 "$REPEAT"); do
            start=$(date +%s)
            rc=0
            run_once || rc=$?
            echo "probe: run=$i/$REPEAT exit=$rc seconds=$(( $(date +%s) - start ))"
            df -h .
            if [ "$rc" -ne 0 ]; then
              final=$rc
              failures=$((failures + 1))
            fi
          done
          echo "probe: failures=$failures/$REPEAT"
          echo "exit_code=$final" >> "$GITHUB_OUTPUT"
          exit "$final"
      - name: Summary
        if: always()
        shell: bash
        env:
          OS: ${{ inputs.os }}
          COMMAND: ${{ inputs.command }}
          REPEAT: ${{ inputs.repeat }}
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          printf 'probe-summary: os=%s command=%s repeat=%s exit=%s outcome=%s\n' \
            "$OS" "'$COMMAND'" "$REPEAT" "${EXIT_CODE:-none}" "$OUTCOME"

  # Prints, for each way of starting a child process, whether the child's token is
  # elevated (the check kcc refuses on), its integrity level, and the groups and
  # privileges that keep it elevated. Every method step succeeds only when its child
  # is not elevated and can build; the Summary step lists them all.
  windows-token:
    name: Windows token probe
    if: inputs.token_probe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A directory the de-elevated children can read the script from and write to,
      # and the same grants the test leg gives before it runs the launcher.
      - name: Prepare the probe directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kcc-token-probe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -LiteralPath .github/scripts/deelevate.ps1 -Destination $dir
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $dir /grant "*${sid}:(OI)(CI)M" /T /C /Q
          if ($LASTEXITCODE -ne 0) { throw "icacls exited $LASTEXITCODE" }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' |
            Select-Object EnableLUA, ConsentPromptBehaviorAdmin, FilterAdministratorToken | Format-List
          & whoami.exe /groups
          & whoami.exe /priv
          ./.github/scripts/deelevate.ps1 -GrantAccess
      - name: (a) job token
        id: job
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -Report -Label job-token
      - name: (b) launcher, own token with integrity Medium
        id: medium
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -Method medium -CommandLine 'cmd.exe /d /c exit 0'
      - name: (c) launcher, SAFER normal-user token with integrity Medium
        id: safer_medium
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -Method safer-medium -CommandLine 'cmd.exe /d /c exit 0'
      - name: (d) launcher, restricted token without privileges, integrity Medium
        id: restricted_medium
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -Method restricted-medium -CommandLine 'cmd.exe /d /c exit 0'
      - name: (d2) launcher, elevated groups deny-only, integrity Medium
        id: filtered
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -Method filtered -CommandLine 'cmd.exe /d /c exit 0'
      - name: (d3) launcher, elevated groups deny-only, integrity unchanged
        id: filtered_high
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -Method filtered-high -CommandLine 'cmd.exe /d /c exit 0'
      - name: (e) launcher, SAFER normal-user token unchanged (expected elevated)
        id: safer
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -Method safer -CommandLine 'cmd.exe /d /c exit 0'
      # A fresh standard (non-admin) local user started through the secondary logon
      # service (CreateProcessWithLogonW). Windows PowerShell for the LocalAccounts
      # module. The random password is never printed; the next step removes the user.
      - name: (f) standard local user through Start-Process -Credential
        id: standard_user
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'kcc-token-probe'
          $out = Join-Path $dir 'standard-user.txt'
          $temp = Join-Path $dir 'standard-user-temp'
          function Stop-Probe([string] $verdict) {
            Write-Output "method=standard-user verdict=$verdict"
            exit 1
          }
          function Format-Error($record) { return ($record.Exception.Message -replace '\s+', ' ').Trim() }
          function Quote([string] $text) { return "'" + $text.Replace("'", "''") + "'" }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          try {
            $bytes = New-Object byte[] 24
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $secure = ConvertTo-SecureString ([Convert]::ToBase64String($bytes) + 'a1!A') -AsPlainText -Force
            New-LocalUser -Name kccci -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } catch { Stop-Probe "user-error error=$(Format-Error $_)" }
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $dirs = @($dir, $env:GITHUB_WORKSPACE, $cargoHome, $rustupHome, $env:RUNNER_TEMP) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          foreach ($d in $dirs) {
            & icacls.exe $d /grant 'kccci:(OI)(CI)M' /T /C /Q
            if ($LASTEXITCODE -ne 0) { Stop-Probe "grant-error dir=$d icacls_exit=$LASTEXITCODE" }
          }
          # The child's environment comes from the new user's profile, so the wrapper
          # sets what the report and cargo need. Paths only, no secrets.
          $wrapper = Join-Path $dir 'standard-user.ps1'
          Set-Content -LiteralPath $wrapper -Encoding Ascii -Value @(
            "`$env:GITHUB_WORKSPACE = $(Quote $env:GITHUB_WORKSPACE)",
            "`$env:RUNNER_TEMP = $(Quote $env:RUNNER_TEMP)",
            "`$env:CARGO_HOME = $(Quote $cargoHome)",
            "`$env:RUSTUP_HOME = $(Quote $rustupHome)",
            "`$env:TEMP = $(Quote $temp)",
            "`$env:TMP = $(Quote $temp)",
            "`$env:Path = $(Quote (Join-Path $cargoHome 'bin')) + ';' + `$env:Path",
            "& $(Quote (Join-Path $dir 'deelevate.ps1')) -Report -Label standard-user -OutFile $(Quote $out)",
            'exit $LASTEXITCODE'
          )
          $credential = New-Object System.Management.Automation.PSCredential ("$env:COMPUTERNAME\kccci", $secure)
          $shell = (Get-Process -Id $PID).Path
          try {
            $child = Start-Process -FilePath $shell -Credential $credential -LoadUserProfile -WorkingDirectory $dir `
              -WindowStyle Hidden -PassThru -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "`"$wrapper`"")
          } catch { Stop-Probe "launch-error error=$(Format-Error $_)" }
          # The first logon builds the user's profile, so the report can take a while.
          # The wait ends when the report file exists, the child exits, or after 120 s.
          # WaitForExit needs a handle the new user's process DACL may refuse; then the
          # loop polls the file once a second.
          $deadline = (Get-Date).AddSeconds(120)
          $canWait = $true
          while (-not (Test-Path -LiteralPath $out)) {
            if ((Get-Date) -ge $deadline) { Stop-Probe 'timeout no-report-within=120s' }
            $exited = $false
            if ($canWait) {
              try { $exited = $child.WaitForExit(1000) } catch { $canWait = $false }
            }
            if (-not $canWait) { Start-Sleep -Seconds 1 }
            if ($exited -and -not (Test-Path -LiteralPath $out)) {
              $code = try { '0x{0:X8}' -f $child.ExitCode } catch { 'unknown' }
              Stop-Probe "no-output child_exit=$code"
            }
          }
          $line = (Get-Content -LiteralPath $out -Raw).Trim()
          Write-Output $line
          if ($line -notmatch '(^| )verdict=ok( |$)') { exit 1 }
      - name: (g) launcher, auto, as the test leg runs it
        id: auto
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/deelevate.ps1 -CommandLine 'cargo --version'
      - name: Remove the probe user
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -IncludeUserName | Where-Object { $_.UserName -like '*\kccci' } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (Get-LocalUser -Name kccci -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name kccci
            Write-Output 'removed the probe user kccci'
          }
      - name: Summary
        if: always()
        shell: bash
        env:
          JOB: ${{ steps.job.outcome }}
          MEDIUM: ${{ steps.medium.outcome }}
          SAFER_MEDIUM: ${{ steps.safer_medium.outcome }}
          RESTRICTED_MEDIUM: ${{ steps.restricted_medium.outcome }}
          FILTERED: ${{ steps.filtered.outcome }}
          FILTERED_HIGH: ${{ steps.filtered_high.outcome }}
          SAFER: ${{ steps.safer.outcome }}
          STANDARD_USER: ${{ steps.standard_user.outcome }}
          AUTO: ${{ steps.auto.outcome }}
        run: |
          echo "token-summary: success = that method's child is not elevated and can build"
          echo "token-summary: job_token=$JOB medium=$MEDIUM safer_medium=$SAFER_MEDIUM restricted_medium=$RESTRICTED_MEDIUM filtered=$FILTERED filtered_high=$FILTERED_HIGH safer=$SAFER standard_user=$STANDARD_USER auto=$AUTO"
