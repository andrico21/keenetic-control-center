    { crate = "hmac@0.12.1", reason = "jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth` (and hkdf 0.12.4 / rfc6979 0.4.0); 0.13.0 is kcc's own (kcc-rci, kcc-testkit) and the kit's and russh 0.65.4's" },
    { crate = "num-bigint@0.4.8", reason = "der-parser 10.0.0 -> x509-parser 0.18.1 -> kcc-rci and rmcp-server-kit; 0.5.1 comes through russh 0.65.4 -> kcc-testkit" },
