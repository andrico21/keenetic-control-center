# deny.toml - workspace root
[graph]
all-features = true # optional dependencies are held to the same policy

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Scope, NOT a lint level: one of "all" | "workspace" | "transitive" | "none".
# "all" - transitive deps are where most RUSTSEC exposure actually lives.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Only these advisory ids are ignored; any other advisory still fails the gate.
# Keep in sync with .cargo/audit.toml. Review by 2027-02-18.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 (Marvin attack, timing side channel on RSA private-key operations) comes only through jsonwebtoken 11.1.0 (`rust_crypto`) <- rmcp-server-kit 3.21.1 `oauth`; kcc and rmcp-server-kit only VERIFY RSA signatures from an external identity provider (RS*/PS* with its public key), the Marvin attack needs private-key operations, and kcc signs its own tokens with Ed25519 through ring; the fix is rsa 0.10, which only jsonwebtoken 12 uses, and the kit pins jsonwebtoken 11; owner decision 2026-11-22, review by 2027-02-18; remove when rmcp-server-kit moves to jsonwebtoken 12 (rsa 0.10)" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (timing variability in operations meant to be constant-time) comes only through elliptic-curve 0.13.8 <- ecdsa 0.16.9 / p256 0.13.2 / p384 0.13.1 <- jsonwebtoken 11.1.0 (`rust_crypto`) <- rmcp-server-kit 3.21.1 `oauth`; the kit's production code imports only decode, decode_header, DecodingKey and Validation from jsonwebtoken (every encode/EncodingKey use in its src/oauth.rs and src/auth.rs is under #[cfg(test)]), so ECDSA runs only on public inputs (an identity provider's public key and a token signature) and RSA only verifies; kcc signs its own tokens with Ed25519 through ring; there is no 0.5.x fix (patched >= 0.7.6) and the kit pins jsonwebtoken 11; owner decision 2026-11-22, review by 2027-02-18; remove when rmcp-server-kit moves to jsonwebtoken 12 (crypto-bigint >= 0.7.6)" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is an unmaintained notice, not a vulnerability, and no safe upgrade exists; kcc uses it directly (kcc-app for duration settings through humantime_serde and humantime::parse_duration for environment overrides; kcc-web for RFC 3339 formatting and parsing); rmcp-server-kit 3.21.1 also requires it (directly and through humantime-serde), so removing kcc's own use would not clear the notice; no upstream fix exists; owner decision 2026-11-18, review by 2027-02-18" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is an unmaintained notice, not a vulnerability, and no safe upgrade exists; kcc uses it directly (kcc-telemetry for log timestamp parsing and formatting); rmcp 3.11.0, rmcp-server-kit 3.21.1 and schemars 1.2.3 also require it, so removing kcc's own use would not clear the notice; no upstream fix exists; owner decision 2026-11-18, review by 2027-02-18" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-root-certs <- rustls-platform-verifier 0.7.1 <- reqwest 0.13.5 <- rmcp-server-kit 3.21.1
]

# Task 56's Windows elevation check uses check_elevation 0.3.0 (BSD-3-Clause)
# with windows-sys 0.52.0 only; both licenses are already allowed above.

[bans]
multiple-versions = "deny" # unavoidable duplicates go into `skip`, each with a reason
wildcards = "deny" # No * version specs
allow-wildcard-paths = false
highlight = "all"

# Unavoidable duplicates, inherited from rmcp-server-kit 3.21.1 (incl. its `metrics` prometheus 0.14 and its `oauth` jsonwebtoken 11) and russh 0.65.4; mirrors clippy.toml `allowed-duplicate-crates`.
skip = [
    { crate = "base16ct@0.2.0", reason = "elliptic-curve 0.13.8 / sec1 0.7.3 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 1.0.0 comes through elliptic-curve 0.14.3 / sec1 0.8.1 -> russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "base64@0.22.1", reason = "jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth` (and pem 3.0.6); 0.23.1 is kcc's own (kcc-app, kcc-config, kcc-domain, kcc-rci, kcc-testkit, kcc-web) and the kit's, reqwest's and rmcp's" },
    { crate = "bitflags@1.3.2", reason = "windows-permissions 0.2.4 -> rmcp-server-kit 3.21.1 (Windows-only)" },
    { crate = "block-buffer@0.10.4", reason = "digest 0.10.7 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.12.1 comes through digest 0.11.3 (kcc's sha2 0.11 / hmac 0.13, the kit, russh 0.65.4 -> kcc-ssh and kcc-testkit)" },
    { crate = "const-oid@0.9.6", reason = "der 0.7.10 / digest 0.10.7 / rsa 0.9.10 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.10.3 comes through der 0.8.3 / digest 0.11.3 (kcc's sha2 0.11, russh 0.65.4 -> kcc-ssh and kcc-testkit)" },
    { crate = "cpufeatures@0.2.17", reason = "sha2 0.10.9 / curve25519-dalek 4.1.3 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.3.1 comes through kcc's sha2 0.11.1, argon2 0.6.0 and chacha20poly1305 0.11" },
    { crate = "crypto-bigint@0.5.5", reason = "elliptic-curve 0.13.8 -> ecdsa 0.16.9 / p256 0.13.2 / p384 0.13.1 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.7.11 comes through russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "crypto-common@0.1.6", reason = "digest 0.10.7 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.2.2 comes through digest 0.11.3 and aead/cipher (kcc's sha2 0.11 and chacha20poly1305 0.11, russh 0.65.4 -> kcc-ssh and kcc-testkit)" },
    { crate = "curve25519-dalek@4.1.3", reason = "ed25519-dalek 2.2.0 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 5.0.0 comes through ed25519-dalek 3.0.0 -> russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "der@0.7.10", reason = "pkcs8 0.10.2 / sec1 0.7.3 / spki 0.7.3 / pkcs1 0.7.5 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.8.3 comes through russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "digest@0.10.7", reason = "sha2 0.10.9 / hmac 0.12.1 / rsa 0.9.10 / ecdsa 0.16.9 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.11.3 comes through kcc's sha2 0.11 / hmac 0.13 / md-5 0.11, the kit and russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "ecdsa@0.16.9", reason = "p256 0.13.2 / p384 0.13.1 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.17.0 comes through p256/p384 0.14.0 -> russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "ed25519@2.2.3", reason = "ed25519-dalek 2.2.0 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 3.0.0 comes through ed25519-dalek 3.0.0 -> russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "ed25519-dalek@2.2.0", reason = "jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 3.0.0 comes through russh 0.65.4 -> kcc-ssh and kcc-testkit (and ssh-key 0.7.0-rc.12)" },
    { crate = "elliptic-curve@0.13.8", reason = "ecdsa 0.16.9 / p256 0.13.2 / p384 0.13.1 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.14.3 comes through russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "ff@0.13.1", reason = "elliptic-curve 0.13.8 / group 0.13.0 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.14.0 comes through elliptic-curve 0.14.3 -> russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "fiat-crypto@0.2.9", reason = "curve25519-dalek 4.1.3 -> ed25519-dalek 2.2.0 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.3.0 comes through curve25519-dalek 5.0.0 / p384 0.14.0 -> russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "getrandom@0.2.17", reason = "only ring 0.17.14 -> rustls 0.23 / rustls-webpki 0.103 / rcgen 0.14 -> reqwest 0.13.5, rmcp-server-kit and kcc, and ring 0.17.14 -> russh 0.65.4 -> kcc-testkit" },
    { crate = "getrandom@0.3.4", reason = "governor 0.10.4 and rand_core 0.9.5 -> rmcp-server-kit" },
    { crate = "group@0.13.0", reason = "elliptic-curve 0.13.8 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.14.0 comes through elliptic-curve 0.14.3 -> russh 0.65.4 -> kcc-ssh and kcc-testkit" },
    { crate = "hashbrown@0.14.5", reason = "dashmap 6.2.1 -> governor 0.10.4 -> rmcp-server-kit" },
