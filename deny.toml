    { crate = "pem@3.0.6", reason = "jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 4.0.0 comes through rcgen 0.14.10 -> kcc and kcc-rci" },
