# deny.toml - workspace root
[graph]
all-features = true # optional dependencies are held to the same policy

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Scope, NOT a lint level: one of "all" | "workspace" | "transitive" | "none".
# "all" - transitive deps are where most RUSTSEC exposure actually lives.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# Only these two advisory ids are ignored; any other advisory still fails the gate.
# Keep in sync with .cargo/audit.toml. Review by 2027-02-18.
ignore = [
    { id = "RUSTSEC-2026-0542", reason = "humantime is an unmaintained notice, not a vulnerability, and no safe upgrade exists; kcc uses it directly (kcc-app for duration settings through humantime_serde and humantime::parse_duration for environment overrides; kcc-web for RFC 3339 formatting and parsing); rmcp-server-kit 3.21.1 also requires it (directly and through humantime-serde), so removing kcc's own use would not clear the notice; no upstream fix exists; owner decision 2026-11-18, review by 2027-02-18" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is an unmaintained notice, not a vulnerability, and no safe upgrade exists; kcc uses it directly (kcc-telemetry for log timestamp parsing and formatting); rmcp 3.10.0, rmcp-server-kit 3.21.1 and schemars 1.2.3 also require it, so removing kcc's own use would not clear the notice; no upstream fix exists; owner decision 2026-11-18, review by 2027-02-18" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-root-certs <- rustls-platform-verifier 0.7.1 <- reqwest 0.13.5 <- rmcp-server-kit 3.21.1
]

# Task 56's Windows elevation check uses check_elevation 0.3.0 (BSD-3-Clause)
# with windows-sys 0.52.0 only; both licenses are already allowed above.

[bans]
multiple-versions = "deny" # unavoidable duplicates go into `skip`, each with a reason
wildcards = "deny" # No * version specs
allow-wildcard-paths = false
highlight = "all"

# Unavoidable duplicates, all inherited from rmcp-server-kit 3.21.1 (incl. its `metrics` prometheus 0.14); mirrors clippy.toml `allowed-duplicate-crates`.
skip = [
    { crate = "bitflags@1.3.2", reason = "windows-permissions 0.2.4 -> rmcp-server-kit 3.21.1 (Windows-only)" },
    { crate = "getrandom@0.2.17", reason = "only ring 0.17.14 -> rustls 0.23 / rustls-webpki 0.103 / rcgen 0.14 -> reqwest 0.13.5, rmcp-server-kit and kcc" },
    { crate = "getrandom@0.3.4", reason = "governor 0.10.4 and rand_core 0.9.5 -> rmcp-server-kit" },
    { crate = "hashbrown@0.14.5", reason = "dashmap 6.2.1 -> governor 0.10.4 -> rmcp-server-kit" },
    { crate = "hashbrown@0.16.1", reason = "governor 0.10.4 -> rmcp-server-kit" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3.4 -> governor 0.10.4 -> rmcp-server-kit (UEFI target only)" },
    { crate = "rand@0.9.5", reason = "governor 0.10.4 -> rmcp-server-kit" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9.5 / rand_chacha 0.9.0 -> governor 0.10.4 -> rmcp-server-kit" },
    { crate = "syn@2.0.119", reason = "asn1-rs-derive 0.6.0 -> asn1-rs 0.7.2 -> x509-parser 0.18.1 -> rmcp-server-kit" },
    { crate = "synstructure@0.13.2", reason = "asn1-rs-derive 0.6.0 -> asn1-rs 0.7.2 -> x509-parser 0.18.1 -> rmcp-server-kit" },
    { crate = "thiserror@1.0.69", reason = "protobuf 3.7.2 -> prometheus 0.14.0 -> rmcp-server-kit `metrics` and kcc-telemetry" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0.69 -> protobuf 3.7.2 -> prometheus 0.14.0" },
    { crate = "tower-http@0.6.11", reason = "reqwest 0.13.5 -> rmcp-server-kit; 0.7.1 is the kit's direct dependency" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17.14 -> rustls 0.23 -> rmcp-server-kit (Windows-only)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev" # git dependencies pinned to a commit
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
