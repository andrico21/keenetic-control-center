    { crate = "pkcs8@0.10.2", reason = "ed25519 2.2.3 / elliptic-curve 0.13.8 / rsa 0.9.10 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.11.0 comes through russh 0.65.4 -> kcc-ssh and kcc-testkit" },
