# .cargo/audit.toml
# Keep in sync with deny.toml: both tools read their own ignore list, and an
# advisory suppressed in only one of them still fails the other.
# Every ignore entry must name the advisory, state why it does not apply to this
# workspace, and note whether an upstream fix exists. No entry without a reason.
[advisories]
# RUSTSEC-2026-0542: humantime is unmaintained (a notice, not a vulnerability).
# kcc uses it directly (kcc-app for duration settings through humantime_serde and
# humantime::parse_duration for environment overrides; kcc-web for RFC 3339 formatting
# and parsing); rmcp-server-kit 3.21.1 also requires it (directly and through
# humantime-serde), so removing kcc's own use would not clear the notice. No upstream
# fix exists. Owner decision 2026-11-18, review by 2027-02-18.
# RUSTSEC-2026-0543: chrono is unmaintained (a notice, not a vulnerability).
# kcc uses it directly (kcc-telemetry for parsing and formatting log timestamps);
# rmcp 3.10.0, rmcp-server-kit 3.21.1 and schemars 1.2.3 also require it, so removing
# kcc's own use would not clear the notice. No upstream fix exists. Owner decision
# 2026-11-18, review by 2027-02-18.
# RUSTSEC-2026-0592: url 2.5.8 Url::origin() overflows the stack on a nested blob: URL
# (a process abort). The fix is in url >= 2.5.9, published 2026-11-20, but it is inside
# the 3-day global-min-publish-age cooldown until 2026-11-23, so the lockfile cannot take
# it yet. Exposure is limited: kcc calls Url::origin() only on admin-entered values
# (public_url in kcc-app settings, RouterUrl in kcc-rci) and rmcp-server-kit 3.21.1 calls
# it on certificate-revocation URLs only when mTLS revocation is configured, so no
# unauthenticated network input reaches it. Owner decision 2026-11-22, TEMPORARY: remove
# when `cargo update -p url` lands (review by 2026-11-24).
ignore = ["RUSTSEC-2026-0542", "RUSTSEC-2026-0543", "RUSTSEC-2026-0592"]

# No `path` here: cargo-audit does not expand `~` in this file and would clone into
# a literal `./~` directory inside the checkout. It uses its default location
# ($CARGO_HOME/advisory-db). Where that directory already holds an older
# cargo-deny clone, pass an absolute `--db` (scripts/ci-local.sh does).
[database]
fetch = true
stale = false
