# .cargo/audit.toml
# Keep in sync with deny.toml: both tools read their own ignore list, and an
# advisory suppressed in only one of them still fails the other.
# Every ignore entry must name the advisory, state why it does not apply to this
# workspace, and note whether an upstream fix exists. No entry without a reason.
[advisories]
ignore = []

# No `path` here: cargo-audit does not expand `~` in this file and would clone into
# a literal `./~` directory inside the checkout. It uses its default location
# ($CARGO_HOME/advisory-db). Where that directory already holds an older
# cargo-deny clone, pass an absolute `--db` (scripts/ci-local.sh does).
[database]
fetch = true
stale = false
