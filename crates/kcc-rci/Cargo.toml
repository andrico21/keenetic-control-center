[package]
name = "kcc-rci"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
bytes = "1.12.1"
getrandom = "0.4.3"
hmac = { workspace = true, features = ["zeroize"] }
md-5 = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = "0.7.1"
sha2 = { workspace = true }
sha3 = { workspace = true, features = ["zeroize"] }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }
x509-parser = { version = "0.18.1", default-features = false }
zeroize = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
hyper = { version = "1.8.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
proptest = { workspace = true }
rcgen = { workspace = true, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { workspace = true, features = ["util"] }

[package.metadata.cargo-machete]
# md-5 is imported as `md5`, which machete's name matching misses
ignored = ["md-5"]

[lints]
workspace = true
