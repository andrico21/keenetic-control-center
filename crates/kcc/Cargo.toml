[package]
name = "kcc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kcc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4.6.11"
fluent-bundle = "0.16.0"
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-domain = { version = "0.1.0", path = "../kcc-domain" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-mcp = { version = "0.1.0", path = "../kcc-mcp" }
kcc-migrate = { version = "0.1.0", path = "../kcc-migrate" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
kcc-telemetry = { version = "0.1.0", path = "../kcc-telemetry" }
kcc-web = { version = "0.1.0", path = "../kcc-web" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rmcp-server-kit = { version = "3.21.1", features = ["metrics"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["fs", "rt-multi-thread", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-migrate = { version = "0.1.0", path = "../kcc-migrate" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
kcc-web = { version = "0.1.0", path = "../kcc-web" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
url = "2.5.8"
wait-timeout = "0.2.1"
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
caps = { version = "0.5", default-features = false }

[target.'cfg(windows)'.dependencies]
check_elevation = "0.3.0"
