[package]
name = "kcc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kcc"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "4.6.12"
fluent-bundle = { workspace = true }
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-domain = { version = "0.1.0", path = "../kcc-domain" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-mcp = { version = "0.1.0", path = "../kcc-mcp" }
kcc-migrate = { version = "0.1.0", path = "../kcc-migrate" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
kcc-telemetry = { version = "0.1.0", path = "../kcc-telemetry" }
kcc-web = { version = "0.1.0", path = "../kcc-web" }
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rmcp-server-kit = { workspace = true, features = ["metrics"] }
rpassword = "7.5.5"
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-migrate = { version = "0.1.0", path = "../kcc-migrate" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
kcc-web = { version = "0.1.0", path = "../kcc-web" }
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
url = { workspace = true }
wait-timeout = "0.2.1"
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
caps = { version = "0.5.6", default-features = false }

[target.'cfg(windows)'.dependencies]
check_elevation = "0.3.0"
