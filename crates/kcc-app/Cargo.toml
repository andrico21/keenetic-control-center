[package]
name = "kcc-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
ipnet = { version = "2.12.2", features = ["serde"] }
rmcp-server-kit = "3.21.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "rt", "sync"] }
toml = "1.1.8"
url = { version = "2.5.8", features = ["serde"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.cargo-machete]
# humantime-serde is used only via `#[serde(with = "humantime_serde")]`, invisible to machete's import scan
ignored = ["humantime-serde"]

[lints]
workspace = true
