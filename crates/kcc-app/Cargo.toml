[package]
name = "kcc-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = { workspace = true, features = ["password-hash", "alloc", "getrandom"] }
base64 = { workspace = true, features = ["std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
humantime = { workspace = true }
humantime-serde = "1.1.1"
ipnet = { version = "2.12.2", features = ["serde"] }
jiff = { version = "1.0.0", default-features = false, features = ["std", "tzdb-bundle-always"] }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
ring = "0.17.14"
rmcp-server-kit = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["serde"] }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-permissions = "0.2.4"

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
proptest = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[package.metadata.cargo-machete]
# humantime-serde is used only via `#[serde(with = "humantime_serde")]`, invisible to machete's import scan
# ring has no user yet: the MCP authorization server signs its tokens with it (Ed25519); remove this entry when that code lands
ignored = ["humantime-serde", "ring"]

[lints]
workspace = true
