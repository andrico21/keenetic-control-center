# Third-party web assets vendored under `vendor/`, served from `/ui/static/<sha256-prefix>/<file>`.
#
# Each file was extracted once from the npm registry tarball named by `upstream` (path
# `upstream_path` inside it; the tarball matched npm's published `upstream_integrity`) and
# is never edited. `cargo xtask assets-check` recomputes every `sha256`, requires every
# file under `vendor/` to be listed here, and fails on any template reference to an
# unpinned asset. Nothing is ever loaded from a CDN.

[[asset]]
name = "htmx"
version = "2.0.11"
file = "vendor/htmx.min.js"
upstream = "https://registry.npmjs.org/htmx.org/-/htmx.org-2.0.11.tgz"
upstream_path = "package/dist/htmx.min.js"
upstream_integrity = "sha512-Thx/WtpeOQqSrqBCw/A1cwGJGg4UrVa3+sW0GmrM3p4gJgO89ecH4qtbnyzDDWFvBTqjnIMCgELTNt636dtamA=="
sha256 = "d6fdc75f204e6bdefa99b69bf1e6d4ac69b8a364f77929f45c13476b4000f717"
license = "0BSD"
license_file = "LICENSES/htmx-0BSD.txt"

