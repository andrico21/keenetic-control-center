{#- Format one medium: the filesystem first, then the kit asks for the router name. -#}
{%- import "components.html" as ui -%}
{% call ui::dialog_body(t(keys::WEB_SYSTEM_STORAGE_FORMAT_TITLE)) %}
<form class="form" hx-post="{{ post_to }}" hx-target="#page-outcome">
  <input type="hidden" name="media" value="{{ media }}">
  <div class="field">
    <label class="field__label" for="format-filesystem">{{ t(keys::WEB_SYSTEM_STORAGE_FILESYSTEM) }}</label>
    <select class="field__input" id="format-filesystem" name="filesystem">
      {%- for each in filesystems %}
      <option value="{{ each }}">{{ each }}</option>
      {%- endfor %}
    </select>
  </div>
  <p class="dialog__text">{{ t(keys::WEB_SYSTEM_STORAGE_FORMAT_TEXT) }}</p>
  <div class="dialog__actions">
    <button class="button button--danger" type="submit">{{ t(keys::WEB_SYSTEM_STORAGE_FORMAT) }}</button>
  </div>
</form>
{% endcall %}
