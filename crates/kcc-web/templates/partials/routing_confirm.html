{#- The confirmation of a removal on the routing and firewall pages; the answer lands in the page's outcome region. -#}
{%- import "components.html" as ui -%}
{% call ui::dialog_body(title) %}
<p class="dialog__text">{{ t(*text) }}</p>
<form class="form" method="post" action="{{ action }}" hx-post="{{ action }}" hx-target="#page-outcome">
  <div class="dialog__actions">
    <button class="button button--danger" type="submit">{{ t(keys::WEB_ROUTING_REMOVE) }}</button>
  </div>
</form>
{% endcall %}
