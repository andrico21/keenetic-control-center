    <li><a class="tabs__link" href="/ui/admin/mcp"{% if !connections %} aria-current="page"{% endif %}>{{ t(keys::WEB_ADMIN_MCP_CONNECTIONS_SETTINGS_TAB) }}</a></li>
    <li><a class="tabs__link" href="/ui/admin/mcp/connections"{% if connections %} aria-current="page"{% endif %}>{{ t(keys::WEB_ADMIN_MCP_CONNECTIONS_TAB) }}</a></li>
  </ul>
</nav>
