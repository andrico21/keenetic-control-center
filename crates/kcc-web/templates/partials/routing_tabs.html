{#- The routing and firewall pages of one router; the page shown is marked current. -#}
<nav class="tabs tabs--wrap" aria-label="{{ t(keys::WEB_ROUTING_TABS) }}">
  <ul class="tabs__list">
    {%- for tab in tabs %}
    <li><a class="tabs__link" href="{{ tab.href() }}"{% if tab.current() %} aria-current="page"{% endif %}>{{ t(tab.label()) }}</a></li>
    {%- endfor %}
  </ul>
</nav>
