{%- import "components.html" as ui -%}
{% call ui::dialog_body(title) %}
<p class="dialog__text">{{ t(*text) }}</p>
<form class="form" method="post" action="{{ action }}" hx-post="{{ action }}" hx-target="#dialog-content">
  <input type="hidden" name="name" value="{{ name }}">
  {{ ui::field("confirm-name", "confirm", t(keys::WEB_ADMIN_CONFIRM_LABEL), "", error, "text", "off", help) }}
  <div class="dialog__actions">
    <button class="button button--danger" type="submit">{{ t(*button) }}</button>
  </div>
</form>
{% endcall %}
