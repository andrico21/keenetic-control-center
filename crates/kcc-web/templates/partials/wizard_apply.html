{#- Step 7: the apply followed live over the event stream; a reload replays it from the start. Stop while it runs; the end brings Review the result. -#}
<h2 class="wizard-step__title" id="wizard-step-title">{{ title }}</h2>
<p class="page__text">{{ text }}</p>
<section class="job wizard-run" aria-labelledby="run-title" hx-ext="sse" sse-connect="{{ prefix }}/{{ id }}/events" sse-close="done">
  <div class="job__head">
    <h3 class="job__title" id="run-title">{{ t(keys::WEB_MIGRATE_RUN_PROGRESS) }}</h3>
    {%- if running %}
    <button class="button button--ghost job__stop" type="button" hx-post="{{ prefix }}/{{ id }}/stop" hx-target="#toasts" hx-swap="beforeend">{{ t(keys::WEB_EXPLORER_JOB_CANCEL) }}</button>
    {%- endif %}
  </div>
  <div class="wizard-run__progress" sse-swap="progress"><progress class="wizard-run__bar" max="100" value="0">0%</progress></div>
  <p class="wizard-run__heartbeat" sse-swap="heartbeat"></p>
  <ol class="wizard-run__lines" sse-swap="line" hx-swap="beforeend"></ol>
  <div class="wizard-run__end" sse-swap="end" aria-live="polite"></div>
</section>
