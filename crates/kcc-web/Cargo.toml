[package]
name = "kcc-web"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
askama = { workspace = true, features = ["derive", "std"] }
axum = { workspace = true, features = ["form", "http1", "multipart", "tokio"] }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
fluent-bundle = { workspace = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
humantime = { workspace = true }
kcc-app = { version = "1.0.0", path = "../kcc-app" }
kcc-catalog = { version = "1.0.0", path = "../kcc-catalog" }
kcc-config = { version = "1.0.0", path = "../kcc-config" }
kcc-domain = { version = "1.0.0", path = "../kcc-domain" }
kcc-i18n = { version = "1.0.0", path = "../kcc-i18n" }
kcc-migrate = { version = "1.0.0", path = "../kcc-migrate" }
kcc-rci = { version = "1.0.0", path = "../kcc-rci" }
kcc-ssh = { version = "1.0.0", path = "../kcc-ssh" }
kcc-telemetry = { version = "1.0.0", path = "../kcc-telemetry" }
rand = { workspace = true }
rmcp-server-kit = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["limit", "set-header", "timeout"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true }

[dev-dependencies]
kcc-testkit = { version = "1.0.0", path = "../kcc-testkit" }
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
rmcp = { workspace = true, features = ["server"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true, features = ["smallvec", "fmt", "ansi", "tracing-log", "std"] }

[lints]
workspace = true
