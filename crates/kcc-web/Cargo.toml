[package]
name = "kcc-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "tokio"] }
base64 = "0.23.1"
fluent-bundle = "0.16.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
humantime = "2.4.0"
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-domain = { version = "0.1.0", path = "../kcc-domain" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
rand = "0.10.3"
rmcp-server-kit = "3.21.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["limit", "set-header", "timeout"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.8"

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
rmcp = { version = "3.6.0", features = ["server"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "test-util"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[lints]
workspace = true
