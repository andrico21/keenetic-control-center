[package]
name = "kcc-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "1.0.3"
zeroize = "1.9.1"

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
proptest = "1.9.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.17"
