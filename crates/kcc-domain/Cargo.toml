[package]
name = "kcc-domain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
kcc-ssh = { version = "0.1.0", path = "../kcc-ssh" }
kcc-telemetry = { version = "0.1.0", path = "../kcc-telemetry" }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { workspace = true, features = ["smallvec", "fmt", "ansi", "tracing-log", "std"] }
url = { workspace = true }

[lints]
workspace = true
