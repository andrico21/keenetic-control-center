[package]
name = "kcc-domain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
base64 = "0.23.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["time"] }
tokio-util = "0.7.17"

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = "2.5.8"

[lints]
workspace = true
