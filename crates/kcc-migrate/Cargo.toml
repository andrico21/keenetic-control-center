[package]
name = "kcc-migrate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "1.2.0"

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
proptest = "1.9.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[package.metadata.cargo-machete]
# md-5 is imported as `md5`, which machete's name matching misses
ignored = ["md-5"]

[lints]
workspace = true
