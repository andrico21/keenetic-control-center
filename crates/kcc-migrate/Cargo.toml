[package]
name = "kcc-migrate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
askama = { workspace = true, features = ["derive", "std"] }
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-domain = { version = "0.1.0", path = "../kcc-domain" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
md-5 = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
zeroize = { workspace = true }

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
proptest = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
url = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.cargo-machete]
# md-5 is imported as `md5`, which machete's name matching misses
ignored = ["md-5"]

[lints]
workspace = true
