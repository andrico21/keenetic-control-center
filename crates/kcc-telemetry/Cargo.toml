[package]
name = "kcc-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
flate2 = "1.1.11"
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
prometheus = "0.14.0"
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
tempfile = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[lints]
workspace = true
