[package]
name = "kcc-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
prometheus = "0.14.0"
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
tempfile = "3.27.0"
url = "2.5.8"
tokio = { version = "1.48.0", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
