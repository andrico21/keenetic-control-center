[package]
name = "kcc-testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kcc-fake-router"
path = "src/bin/kcc-fake-router.rs"
test = false

[[bin]]
name = "kcc-fake-sinks"
path = "src/bin/kcc-fake-sinks.rs"
test = false

[[bin]]
name = "kcc-capture"
path = "src/bin/kcc-capture.rs"
test = false

[dependencies]
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
hmac = { workspace = true, features = ["zeroize"] }
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
md-5 = { workspace = true }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
rand = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true, features = ["zeroize"] }
subtle = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "test-util"] }
tower = { workspace = true, features = ["util"] }

[package.metadata.cargo-machete]
# md-5 is imported as `md5`, which machete's name matching misses
ignored = ["md-5"]

[lints]
workspace = true
