[package]
name = "kcc-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-config = { version = "0.1.0", path = "../kcc-config" }
kcc-domain = { version = "0.1.0", path = "../kcc-domain" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-migrate = { version = "0.1.0", path = "../kcc-migrate" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
rmcp = { workspace = true, features = ["server"] }
rmcp-server-kit = { workspace = true }
schemars = "1.2.3"
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
proptest = { workspace = true }
rmcp = { workspace = true, features = ["client", "server"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
url = { workspace = true }

[lints]
workspace = true
