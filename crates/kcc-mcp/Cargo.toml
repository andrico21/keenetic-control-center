[package]
name = "kcc-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kcc-app = { version = "0.1.0", path = "../kcc-app" }
kcc-catalog = { version = "0.1.0", path = "../kcc-catalog" }
kcc-i18n = { version = "0.1.0", path = "../kcc-i18n" }
kcc-rci = { version = "0.1.0", path = "../kcc-rci" }
rmcp = { version = "3.6.0", features = ["server"] }
rmcp-server-kit = "3.21.1"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
kcc-testkit = { version = "0.1.0", path = "../kcc-testkit" }
proptest = "1.9.0"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
url = "2.5.8"

[lints]
workspace = true
