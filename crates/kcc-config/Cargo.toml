[package]
name = "kcc-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = { workspace = true, features = ["std", "simd-unsafe"] }
md-5 = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[package.metadata.cargo-machete]
# md-5 is imported as `md5`, which machete's name matching misses
ignored = ["md-5"]

[lints]
workspace = true
