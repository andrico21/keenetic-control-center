# clippy.toml - workspace root
avoid-breaking-exported-api = false # report even when the fix changes public API
check-private-items = true # missing_*_doc lints cover private items too
allow-unwrap-in-tests = false # tests follow the same panic rules
allow-expect-in-tests = false
allow-panic-in-tests = false
allow-dbg-in-tests = false
allow-print-in-tests = false
allow-indexing-slicing-in-tests = false
warn-on-all-wildcard-imports = true
allow-mixed-uninlined-format-args = false
cognitive-complexity-threshold = 25 # drives `cognitive_complexity`
too-many-lines-threshold = 100 # drives `too_many_lines`
max-fn-params-bools = 3 # drives `fn_params_excessive_bools`
enum-variant-size-threshold = 200 # drives `large_enum_variant`
disallowed-methods = [ # kcc never starts a process: an inherited capability bounding set stays unused
    { path = "std::process::Command::new", reason = "kcc starts no process; a test or xtask item that must start one says why in an item-level expect, and the kcc suites go through crates/kcc/tests/support/spawning.rs" },
    { path = "std::process::Command::spawn", reason = "kcc starts no process; a test or xtask item that must start one says why in an item-level expect, and the kcc suites go through crates/kcc/tests/support/spawning.rs" },
    { path = "std::process::Command::output", reason = "kcc starts no process; a test or xtask item that must start one says why in an item-level expect, and the kcc suites go through crates/kcc/tests/support/spawning.rs" },
    { path = "std::process::Command::status", reason = "kcc starts no process; a test or xtask item that must start one says why in an item-level expect, and the kcc suites go through crates/kcc/tests/support/spawning.rs" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "kcc replaces no process image", allow-invalid = true },
    { path = "jiff::tz::db", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::tz::TimeZone::system", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::tz::TimeZone::try_system", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::tz::TimeZone::get", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::tz::TimeZoneDatabase::from_env", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::Timestamp::in_tz", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::civil::DateTime::in_tz", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::civil::Date::in_tz", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
    { path = "jiff::ZonedDateTime::now", reason = "kcc uses only the bundled time zone database (kcc_app::schedules::time::zones); the system zone and zoneinfo files are never read", allow-invalid = true },
]
allowed-duplicate-crates = [ # each unavoidable duplicate, with a reason comment
    "bitflags", # =1.3.2: windows-permissions 0.2.4 -> rmcp-server-kit 3.21.1 (Windows-only)
    "getrandom", # =0.2.17: only ring 0.17.14 -> rustls 0.23 / rustls-webpki 0.103 / rcgen 0.14 -> reqwest 0.13.5, rmcp-server-kit and kcc, and ring 0.17.14 -> russh 0.65.2 -> kcc-testkit; =0.3.4: governor 0.10.4 and rand_core 0.9.5 -> rmcp-server-kit
    "hashbrown", # =0.14.5: dashmap 6.2.1 -> governor 0.10.4; =0.16.1: governor 0.10.4 -> rmcp-server-kit; =0.17.1: indexmap 2.14.2 -> rmcp 3.10.0 -> rmcp-server-kit
    "num-bigint", # =0.4.8: der-parser 10.0.0 -> x509-parser 0.18.1 -> kcc-rci and rmcp-server-kit; =0.5.1: russh 0.65.2 -> kcc-testkit
    "r-efi", # =5.3.0: getrandom 0.3.4 -> governor 0.10.4 -> rmcp-server-kit (UEFI target only)
    "rand", # =0.9.5: governor 0.10.4 -> rmcp-server-kit
    "rand_core", # =0.9.5: rand 0.9.5 / rand_chacha 0.9.0 -> governor 0.10.4 -> rmcp-server-kit
    "syn", # =2.0.119: asn1-rs-derive 0.6.0 -> asn1-rs 0.7.2 -> x509-parser 0.18.1 -> rmcp-server-kit
    "synstructure", # =0.13.2: asn1-rs-derive 0.6.0 -> asn1-rs 0.7.2 -> x509-parser 0.18.1 -> rmcp-server-kit
    "thiserror", # =1.0.69: protobuf 3.7.2 -> prometheus 0.14.0 -> rmcp-server-kit `metrics` and kcc-telemetry
    "thiserror-impl", # =1.0.69: thiserror 1.0.69 -> protobuf 3.7.2 -> prometheus 0.14.0
    "tower-http", # =0.6.11: reqwest 0.13.5 -> rmcp-server-kit; 0.7.1 is the kit's direct dependency
    "windows-sys", # =0.52.0: ring 0.17.14 -> rustls 0.23 -> rmcp-server-kit and ring 0.17.14 -> russh 0.65.2 -> kcc-testkit, check_elevation 0.3.0 -> kcc (Windows-only)
]
doc-valid-idents = ["..", "KeeneticOS", "NetcrazeOS", "Keenetic", "Netcraze", "KeenDNS", "WireGuard", "OpenVPN", "OpenConnect", "ZeroTier", "IPsec", "IKEv2", "SSTP", "L2TP", "PPTP", "PPPoE", "IPoE", "NDMS", "RCI", "htmx", "SSE", "SCRAM", "Argon2id", "SHA3", "DoT", "DoH", "UPnP", "DLNA", "IPTV"]
