    "elliptic-curve", # =0.13.8: ecdsa 0.16.9 / p256 0.13.2 / p384 0.13.1 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.14.3 comes through russh 0.65.4 -> kcc-ssh and kcc-testkit
    "ff", # =0.13.1: elliptic-curve 0.13.8 / group 0.13.0 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.14.0 comes through elliptic-curve 0.14.3 -> russh 0.65.4 -> kcc-ssh and kcc-testkit
