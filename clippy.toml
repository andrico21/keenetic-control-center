    "primeorder", # =0.13.6: p256 0.13.2 / p384 0.13.1 -> jsonwebtoken 11.1.0 (`rust_crypto`) -> rmcp-server-kit 3.21.1 `oauth`; 0.14.0 comes through p256/p384 0.14.0 -> russh 0.65.4 -> kcc-ssh and kcc-testkit
